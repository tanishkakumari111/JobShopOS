name: DB Migration Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      JOBSHOP_DATA_SOURCE: database
      # Use the Neon pooled URL for Prisma Client/runtime queries.
      DATABASE_URL: ${{ secrets.JOBSHOP_DATABASE_URL }}
      # Use the Neon direct URL for Prisma CLI migration/introspection steps.
      DIRECT_URL: ${{ secrets.JOBSHOP_DIRECT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 > next-start.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Next.js did not start in time"
          cat next-start.log
          exit 1

      - name: Smoke test quote command routes
        run: npm run smoke:quote-command-routes

      - name: Smoke test quote commands
        run: npm run smoke:quote-commands
